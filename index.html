<!DOCTYPE html>
<html>
    <head>
        <title>The WaffleFryz House</title>
        <link rel="stylesheet" href="./style.css">
        <script src="./script.js"></script> 
    </head>
    <body>
        <h1 id="strat-title">
            CS Strat Roller
        </h1>
        <p id="strat-desc">
            click on a button 🙂
        </p>
        <h3 id="bothTeamAlert">BOTH TEAMS REQUIRED. ALERT THE OTHER TEAM</h3>
        <button type="button" class="button ct" onclick="rollCTStrat()">Roll CT Strat</button>
        <button type="button" class="button t" onclick="rollTStrat()">Roll T Strat</button>
		<br>
		<button type="button" class="button generic" onclick="rollPistolStrat()">Roll Pistol Strat</button>
        <br><br>
        <label for="dropdown">Enable Both Team Required Strats? (Both teams need to agree to this)</label>
        <br>
        <select name="dropdown" id="enableMultiTeam">
            <option selected value="0">False</option>
            <option value="1">True</option>
        </select>
		<br>
		<input id="searchbar" class="input" placeholder="Type strat name here...">
		<button id="searchbutton" type="button" class="button generic" onclick="search()">Search</button>
		<script>
			var input = document.getElementById("searchbar");
			input.addEventListener("keypress", function(event) {
				if(event.key === "Enter") {
					event.preventDefault();
					document.getElementById("searchbutton").click();
				}
			});
		</script>
    </body>
</html>
